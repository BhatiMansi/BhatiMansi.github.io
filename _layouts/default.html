<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.author.name }}{% else %}{{ site.author.name }}{% endif %}</title>
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap site-header-inner">
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#papers' | relative_url }}">Research Papers</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <nav class="links" aria-label="Profiles and contact">
        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin_handle }}/">LinkedIn</a>
        <a href="mailto:{{ site.email }}">Email</a>
        {% if site.scholar_url != "" %}<a href="{{ site.scholar_url }}">Scholar</a>{% endif %}
      </nav>
      <p class="colophon">© {{ 'now' | date: "%Y" }} {{ site.author.name }}. Built with Jekyll on GitHub Pages.</p>
    </div>
  </footer>
</body>
</html>
